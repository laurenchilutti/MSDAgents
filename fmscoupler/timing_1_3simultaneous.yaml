What does sfc_boundary_layer do?: "`sfc_boundary_layer` computes and exchanges fluxes\
  \ at the surface between the atmosphere and land/ice/ocean components. It calculates\
  \ the following fluxes:\n\n- Atmosphere to exchange grid:\n  - Temperature (`t_bot`),\
  \ height (`z_bot`), pressure (`p_bot`), u/v-wind (`u_bot`, `v_bot`), surface pressure\
  \ (`p_surf`), sea level pressure (`slp`), gust factor (`gust`), and coupler boundary\
  \ condition fields.\n\n- Ice boundary to exchange grid:\n  - Surface temperature\
  \ (`t_surf`), roughness lengths for momentum, heat, and moisture (`rough_mom`, `rough_heat`,\
  \ `rough_moist`), albedos (`albedo`, `albedo_vis_dir`, `albedo_nir_dir`, `albedo_vis_dif`,\
  \ `albedo_nir_dif`), and surface u/v-wind (`u_surf`, `v_surf`).\n\n- Land boundary\
  \ to exchange grid:\n  - Surface temperature (`t_surf`), canopy air temperature\
  \ (`t_ca`), roughness lengths for momentum and heat (`rough_mom`, `rough_heat`),\
  \ albedos, tracers, and other relevant fields.\n\n- Exchange grid to `Land_ice_atmos_boundary`:\n\
  \  - Temperature (`t`), albedos, land fraction (`land_frac`), temperature tendency\
  \ (`dt_t`), tracer tendencies (`dt_tr`), u/v-fluxes (`u_flux`, `v_flux`), u/v-stress\
  \ tendencies (`dtaudu`, `dtaudv`), friction velocity (`u_star`), buoyancy flux (`b_star`),\
  \ and roughness length for momentum (`rough_mom`).\n\nIt also computes stocks for\
  \ heat from radiative and turbulent fluxes, and heat carried by rivers and precipitation\
  \ minus evaporation (PME), assuming a reference temperature of 0°C.\n\nTime to generate\
  \ response: 88.85 seconds"
There are all these stock computations.  What is a stock and why are they needed?: 'A
  stock, in the context of FMSCoupler, refers to the globally integrated total amount
  of conserved quantities such as mass (e.g., water), heat, and salt in each component
  model (atmosphere, land, ice, ocean). Stocks are used to check conservation, ensuring
  that these quantities are neither created nor destroyed within the coupled climate
  models. They are needed for:


  1. **Conservation Check**: To verify that the total amount of a conserved quantity
  remains constant throughout the simulation.

  2. **Diagnostic Tool**: Stock computations help diagnose any inconsistencies or
  errors in the model''s flux calculations and transport processes.

  3. **Model Validation**: Comparing stock changes with respect to initial values
  helps validate the model''s performance and identify potential issues.


  In FMSCoupler, several subroutines like `flux_init_stocks`, `coupler_flux_init_finish_stocks`,
  and `flux_check_stocks` are dedicated to initializing, updating, and checking these
  stocks to maintain conservation and ensure model integrity.


