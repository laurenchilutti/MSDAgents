What happens in the coupler?: 'In the FMSCoupler, the following key processes occur:


  1. **Flux Exchange**: The `coupler_main` program manages time loops to advance the
  coupled model and facilitates flux exchange between atmosphere, ocean, land, and
  sea-ice components.


  2. **Initialization**: The `coupler_init` subroutine initializes all component models
  and the flux-exchange infrastructure. It sets up runtime configurations before starting
  the time stepping loops.


  3. **Restart Time Management**: The `time_restart` variable is updated after writing
  restarts, while `time_restart_current` represents the current intermediate restart
  time.


  4. **Heat Stocks Computation**: The coupler computes stocks for heat from radiative
  and turbulent fluxes and heat carried by river and precipitation minus evaporation
  (PME), assuming a reference temperature of 0°C and consistent with ocean and ice
  models.


  5. **Ice-Ocean Flux Update**: The `flux_ocean_from_ice_stocks` subroutine updates
  ocean stocks after flux transfer from ice, using Ice_Ocean_boundaryfluxes for calculations.


  6. **Termination**: The `termination` clock is used in the `coupler_end` finalization
  phase to mark the end of the coupled model run.


