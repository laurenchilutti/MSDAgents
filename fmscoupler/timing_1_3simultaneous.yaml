Why are there so many checksum subroutines?: 'The numerous checksum subroutines in
  FMSCoupler serve different purposes to ensure data integrity and consistency across
  coupled components (atmosphere, ocean, land, ice) during various stages of model
  execution:


  1. **coupler_chksum_type**: This object holds pointers to all component derived
  types for efficient access during checksum computation.


  2. **coupler_end**: Computes checksums when `do_chksum` or `do_endpoint_chksum`
  is true, ensuring data consistency before finalizing models and writing restart
  files.


  3. **coupler_summarize_timestep**: Reports coupled-timestep progress and computes
  checksums (when `do_chksum=.true.`) to monitor data integrity each timestep.


  4. **get_ocean_chksums**: Prints ocean and ice-ocean boundary field checksums, helping
  diagnose potential issues in these specific components.


  The multiple checksum subroutines allow for:

  - Regular data consistency checks at different stages of the model execution.

  - Targeted checks for specific components or fields (e.g., `get_ocean_chksums`).

  - Efficient access to component data through the `coupler_components_type` object.


