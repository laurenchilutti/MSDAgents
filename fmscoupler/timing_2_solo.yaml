What happens in the coupler?: "The FMSCoupler facilitates communication between atmosphere,\
  \ ocean, land, and ice components in GFDL's coupled climate models. Here are some\
  \ key processes that happen within the coupler:\n\n1. **Flux Exchange**: The `coupler_main`\
  \ subroutine manages the main time loops to advance the coupled model and calls\
  \ flux exchange routines between all components. Fluxes exchanged include heat,\
  \ momentum (wind stresses), freshwater (precipitation minus evaporation), and others.\n\
  \n2. **Clock Management**:\n   - `coupler_clocks`: Keeps track of time steps for\
  \ each component.\n   - `time_restart` & `time_restart_current`: Manage intermediate\
  \ restart times in the coupler.\n   - `current_timestep`: Tracks the current timestep\
  \ during model integration.\n\n3. **Initialization and Finalization**:\n   - `coupler_init`:\
  \ Initializes all component models, flux-exchange infrastructure, and runtime configurations\
  \ before time stepping loops begin.\n   - `termination` clock: Signals the end of\
  \ the coupler's finalization phase (`coupler_end`).\n\n4. **Stock Updates**: Subroutine\
  \ `flux_ocean_from_ice_stocks` updates heat stocks in the Ocean component after\
  \ receiving fluxes from Ice, using internally consistent boundary fluxes.\n\n5.\
  \ **Boundary Conditions**:\n   - `Ice_ocean_boundary%wind_stagger`: Specifies how\
  \ wind stresses are discretized spatially.\n   - `Ice_ocean_boundary%u10_sqr`: Provides\
  \ wind speed squared at 10m height for NUOPC cap only.\n\nTime to generate response:\
  \ 27.00 seconds"
What happens in the fast loop?: "In the fast loop (atmos_loop), the atmosphere, land\
  \ surface, and fast sea-ice are advanced by one atmospheric timestep (Time_step_atmos).\
  \ Here's what happens:\n\n1. **Atmospheric downward sweep**: Heat and moisture are\
  \ exchanged between the atmosphere and the surface using a tridiagonal scheme for\
  \ implicit vertical diffusion.\n   - `coupler_update_atmos_model_down`: Forward\
  \ (downward) sweep from atmospheric top to surface.\n   - `coupler_flux_down_from_atmos`:\
  \ Transfers forward-elimination coefficients to land/ice.\n\n2. **Land and ice fast\
  \ updates**:\n   - `coupler_update_land_model_fast`: Computes new surface temperatures\
  \ for land.\n   - `coupler_update_ice_model_fast`: Computes new surface temperatures\
  \ for fast sea-ice.\n\n3. **Atmospheric diagnostics and tracer state update**: `update_atmos_model_state`\
  \ is called to advance atmospheric diagnostics and tracer state.\n\n4. **Fast-ice\
  \ accumulators reset and boundary exchange**:\n   - `ice_model_fast_cleanup`: Resets\
  \ fast-ice accumulators.\n   - `unpack_land_ice_boundary`: Copies Land_ice_boundary\
  \ into ice internals.\n   - `exchange_fast_to_slow_ice`: Exchanges fast-ice averages\
  \ to the slow-ice side.\n\nTime to generate response: 24.51 seconds"
What happens in the slow loop?: 'In the slow loop, also known as the coupled time
  loop (controlled by `main`), the ocean and slow sea-ice models advance by one coupled
  timestep (`dt_cpld`). Here''s what happens:


  1. **Ocean advancement**: The ocean model takes a step forward based on its internal
  dynamics and physics.

  2. **Slow sea-ice advancement**: The slow sea-ice model (Ice%slow_ice_pe) advances,
  handling dynamics, freezing/melting, and transport at the coupled timestep.

  3. **Flux exchange**: Ocean-ice fluxes are exchanged once per iteration of the slow
  loop.


  The slow loop iterates `num_cpld_calls` times, with each iteration tracked by the
  counter `nc`. The time tracked for the ocean (`Time_ocean`) and flux exchange from
  ocean to ice (`Time_flux_ocean_to_ice`) is also updated in this loop.


  Time to generate response: 17.29 seconds'
