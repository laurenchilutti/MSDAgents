How do I add a variable to write out to a file?: "To add a variable to write out to\
  \ a file in FMSCoupler, you would typically follow these steps:\n\n1. **Define the\
  \ variable**: First, ensure that the variable is defined and has the appropriate\
  \ type (e.g., real, integer, character) and dimensions.\n\n2. **Open the output\
  \ file**: You need to open the file where you want to write the data. In FMSCoupler,\
  \ this could be done using the `fms2_io` module. For example:\n\n   ```fortran\n\
  \   type(fms2_io), intent(inout) :: io_unit\n   logical, intent(in) :: divert_stocks_report\n\
  \n   if (divert_stocks_report) then\n       call fms2_open_file(io_unit, 'stocks.out',\
  \ action='write')\n   else\n       call fms2_open_file(io_unit, stdout, action='write')\n\
  \   end if\n   ```\n\n3. **Write the variable to the file**: Once the file is open\
  \ and the variable is defined, you can write the data using appropriate I/O statements.\
  \ For example:\n\n   ```fortran\n   real, intent(in) :: my_variable\n\n   call fms2_write(io_unit,\
  \ my_variable)\n   ```\n\n4. **Close the output file**: After writing the data,\
  \ don't forget to close the file.\n\n   ```fortran\n   call fms2_close_file(io_unit)\n\
  \   ```\n\nTime to generate response: 38.35 seconds"
What is written out in the restarts?: "In the `coupler_intermediate_restart` subroutine,\
  \ the following are written out to mid-run restart files:\n\n1. **Component model\
  \ restarts**:\n   - Atmosphere, land, and ice restarts on PEs where Atmpe is true.\n\
  \   - Ocean restart on PEs where Oceanis_ocean_pe is true.\n\n2. **Coupler-specific\
  \ boundary-condition restart data**:\n   - Ocn_bc_restart\n   - Ice_bc_restart\n\
  \nAfter writing these files, `Time_restart` is advanced by `restart_interval` to\
  \ set the next scheduled intermediate restart time. If the optional `time_stamp`\
  \ argument is present, it prefixes all file names to allow multiple intermediate\
  \ restart sets to coexist in the RESTART/ directory.\n\nIn the `coupler_restart`\
  \ subroutine, all coupler-owned restart files are written. These include:\n\n1.\
  \ Coupler-specific boundary-condition restart data:\n   - Ocn_bc_restart\n   - Ice_bc_restart\n\
  \n2. Component model restarts (if provided as arguments):\n   - Atmosphere (`atm`)\n\
  \   - Ice (`ice`)\n   - Ocean (`ocean`)\n   - Ocean state (`ocean_state`)\n\nTime\
  \ to generate response: 31.07 seconds"
How do I add a variable to write out to a restart file?: "To add a variable to be\
  \ written out to a restart file in FMSCoupler, you would need to:\n\n1. Define the\
  \ variable and its attributes (e.g., name, type, description) in the appropriate\
  \ module or namelist.\n2. Include the variable in the list of variables that are\
  \ written to the restart file(s). This could involve modifying the `coupler_restart`\
  \ subroutine to add the new variable to the list of ocean fields restarts (`Oceanfields_restart`),\
  \ ice-ocean fluxes restarts (`Iceocean_fluxes_restart`), or other relevant lists.\n\
  3. Ensure that the variable is initialized and updated correctly throughout the\
  \ model run, so that its current state can be accurately saved to the restart file.\n\
  \nHere's an example of how you might add a new real, scalar variable named `new_variable`\
  \ with a description \"A new variable for restart\":\n\n```fortran\n! Add this to\
  \ the appropriate module or namelist\nreal :: new_variable  ! New variable to be\
  \ written to restart files\nlogical :: do_write_new_variable = .false.  ! Namelist\
  \ flag to control writing of new_variable\n\n! Modify coupler_restart subroutine\
  \ to include new_variable in Oceanfields_restart list\nif (do_write_new_variable)\
  \ then\n    Oceanfields_restart%var_list = [Oceanfields_restart%var_list, 'new_variable']\n\
  end if\n\n! Initialize and update new_variable as needed throughout the model run\n\
  \n! Write new_variable to restart file when coupler_restart is called\nif (do_write_new_variable)\
  \ then\n    write(Oceanfields_restart%unit, *) Oceanfields_restart%time, new_variable\n\
  end if\n```\n\nTime to generate response: 44.72 seconds"
