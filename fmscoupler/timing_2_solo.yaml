There are all these stock computations.  What is a stock and why are they needed?: 'A
  "stock" in the context of FMSCoupler refers to the globally integrated total amount
  of conserved quantities such as mass (e.g., water), heat, or salt within each climate
  component (atmosphere, land, ice, ocean). Stocks are used to check conservation,
  i.e., to ensure that these quantities are neither created nor destroyed but only
  transferred between components. They are needed for:


  1. **Conservation Check**: To verify that the model is conserving mass, heat, and
  salt according to physical laws.

  2. **Diagnostic Tool**: Stocks help diagnose errors or inconsistencies in the model''s
  flux calculations.

  3. **Model Validation**: Comparing stock changes with respect to initial values
  helps validate the model''s performance over time.


  In FMSCoupler, stocks are initialized (flux_init_stocks), updated after flux transfers
  (e.g., flux_ocean_from_ice_stocks), and checked for conservation (flux_check_stocks)
  at specified intervals or at the end of the run based on the `check_stocks` namelist
  flag.


