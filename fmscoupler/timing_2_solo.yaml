How do I restart a model?: "To restart a model using FMSCoupler, you need to call\
  \ `coupler_restart` function with appropriate arguments. Here's how:\n\n1. Ensure\
  \ that the necessary input/output variables are set correctly:\n   - `time_current`:\
  \ The current model time.\n   - `time_start`: The model start time.\n   - `time_restart_current`:\
  \ The next restart time.\n\n2. Call `coupler_restart` function with these arguments\
  \ to write coupler restart files (`RESTART/coupler.res`) and component restart files\
  \ for atmosphere, ocean, land, and ice models.\n\nHere's a simplified example:\n\
  \n```fortran\ncall coupler_restart(time_current, time_start, time_restart_current)\n\
  ```\n\nAfter this call, the model will be restarted from the `time_restart_current`\
  \ time.\n\nTime to generate response: 15.07 seconds"
Do I need to set any namelist parameter to restart a run?: 'Yes, you need to set `do_endpoint_chksum`
