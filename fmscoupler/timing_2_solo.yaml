How many different pelists are there?: 'There are four different pelists:


  1. `ATMPELIST`: Pelist for atmosphere.

  2. `OCEANPELIST`: Pelist for ocean.

  3. `LANDPELIST`: Pelist for land, which is a subset of `ATMPELIST`.

  4. `ICEFAST_PELIST`: Pelist for fast sea ice, which is also a subset of `ATMPELIST`.


  Additionally, there are two combined pelists:


  1. `Ice%pelist`: Combined list of all ice PEs (union of fast and slow pelists).

  2. `slow_ice_ocean_pelist`: Combined MPI pelist of the slow-ice and ocean PEs.


  So, in total, there are six different pelists.


